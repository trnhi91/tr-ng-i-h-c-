<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Electric Heart - Hand Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000000 !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 40px;
            border-radius: 20px;
            border: 2px solid #ff0077;
            box-shadow: 0 0 30px rgba(255, 0, 119, 0.5);
        }
        
        #loading h2 {
            color: #ff0077;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0077;
        }
        
        #loading p {
            color: #00f2ff;
            font-size: 14px;
        }
        
        .ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            pointer-events: none;
        }
        
        .ui-panel h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #ff0077, #00f2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 119, 0.5);
        }
        
        .status {
            font-size: 16px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            border-left: 3px solid #ff0077;
        }
        
        #video-input {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border-radius: 15px;
            border: 3px solid #ff0077;
            box-shadow: 0 0 20px rgba(255, 0, 119, 0.6);
            transform: scaleX(-1);
            object-fit: cover;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
    </style>
</head>
<body>

<div id="loading">
    <h2> Duyệt cho camera mở dùm nha mom</h2>
    <p>Kiếm chỗ sáng mà ngồi cho dễ thấy bàn tay</p>
</div>

<div class="ui-panel">
    <div class="status">
        <span id="status-text">Đang khởi động camera...</span>
    </div>
</div>

<div id="canvas-container"></div>
<video id="video-input" playsinline autoplay></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
// ========== KHỞI TẠO BIẾN TOÀN CỤC ==========
const videoEl = document.getElementById('video-input');
const loadingEl = document.getElementById('loading');
const statusEl = document.getElementById('status-text');
const container = document.getElementById('canvas-container');

let scene, camera, renderer, heartParticles;
let particlePositions, originalPositions, particleColors;
let expansionLevel = 0;
let targetExpansion = 0;

const PARTICLE_COUNT = 50000;
const EXPANSION_SPEED = 0.18;
const ROTATION_SPEED = 0.004;

// ========== TẠO TRÁI TIM 3D ==========
function createHeartGeometry() {
    const positions = [];
    const colors = [];
    
    const colorCore = new THREE.Color("#ff1a75");
    const colorEdge = new THREE.Color("#00e5ff");
    
    let generated = 0;
    const maxAttempts = PARTICLE_COUNT * 3;
    let attempts = 0;
    
    while (generated < PARTICLE_COUNT && attempts < maxAttempts) {
        attempts++;
        
        const x = (Math.random() - 0.5) * 3.2;
        const y = (Math.random() - 0.5) * 3.2;
        const z = (Math.random() - 0.5) * 3.2;
        
        // Phương trình trái tim 3D
        const x2 = x * x;
        const y2 = y * y;
        const z2 = z * z;
        const equation = Math.pow(x2 + 2.25 * y2 + z2 - 1, 3) - x2 * z * z * z - 0.1125 * y2 * z * z * z;
        
        if (equation <= 0) {
            positions.push(x, z, y);
            
            const distFromCenter = Math.sqrt(x2 + y2 + z2) / 2;
            const colorMix = THREE.MathUtils.clamp(distFromCenter, 0, 1);
            const finalColor = colorCore.clone().lerp(colorEdge, colorMix * 0.8);
            
            colors.push(finalColor.r, finalColor.g, finalColor.b);
            generated++;
        }
    }
    
    return { positions, colors };
}

// ========== KHỞI TẠO THREE.JS ==========
function initThreeJS() {
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 5, 15);
    
    camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 0, 3.8);
    camera.lookAt(0, 0, 0);
    
    renderer = new THREE.WebGLRenderer({ 
        antialias: true,
        alpha: false
    });
    renderer.setClearColor(0x000000, 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);
    
    // Tạo geometry
    const { positions, colors } = createHeartGeometry();
    originalPositions = new Float32Array(positions);
    particleColors = new Float32Array(colors);
    particlePositions = new Float32Array(positions);
    
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
    
    const material = new THREE.PointsMaterial({
        size: 0.008,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.95,
        depthWrite: false,
        sizeAttenuation: true
    });
    
    heartParticles = new THREE.Points(geometry, material);
    scene.add(heartParticles);
    
    // Ánh sáng
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);
}

// ========== MEDIAPIPE HANDS ==========
const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,
    minDetectionConfidence: 0.4,
    minTrackingConfidence: 0.4
});

hands.onResults(onHandResults);

function onHandResults(results) {
    loadingEl.style.display = 'none';
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        
        // Lấy các điểm chính
        const wrist = hand[0];
        const thumbTip = hand[4];
        const indexTip = hand[8];
        const middleTip = hand[12];
        const ringTip = hand[16];
        const pinkyTip = hand[20];
        
        // Tính độ mở của bàn tay
        const dist1 = distance2D(wrist, middleTip);
        const dist2 = distance2D(thumbTip, pinkyTip);
        const avgDist = (dist1 + dist2) / 2;
        
        // Công thức nhạy: bàn tay mở rộng -> trái tim nở
        targetExpansion = Math.max(0, (avgDist - 0.12) * 25);
        
        statusEl.innerText = `✅ Đã kết nối! Độ mở: ${Math.round(targetExpansion * 10)}%`;
        statusEl.style.color = '#00ff88';
    } else {
        statusEl.innerText = '👋 Đưa bàn tay lên camera...';
        statusEl.style.color = '#ff0077';
        targetExpansion = 0;
    }
}

function distance2D(p1, p2) {
    return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
}

// Khởi động camera
const cameraUtil = new Camera(videoEl, {
    onFrame: async () => {
        await hands.send({ image: videoEl });
    },
    width: 480,
    height: 360
});
cameraUtil.start();

// ========== ANIMATION LOOP ==========
function animate() {
    requestAnimationFrame(animate);
    
    // Smooth lerp cho expansion
    expansionLevel = THREE.MathUtils.lerp(expansionLevel, targetExpansion, EXPANSION_SPEED);
    
    const time = Date.now() * 0.001;
    
    // Cập nhật vị trí particles
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        
        // Hiệu ứng điện giật nhẹ
        const jitter = Math.sin(time * 3 + i * 0.1) * 0.003;
        
        // Áp dụng expansion
        const scale = 1 + expansionLevel * 0.08;
        particlePositions[i3] = originalPositions[i3] * scale + jitter;
        particlePositions[i3 + 1] = originalPositions[i3 + 1] * scale + jitter;
        particlePositions[i3 + 2] = originalPositions[i3 + 2] * scale + jitter;
    }
    
    heartParticles.geometry.attributes.position.needsUpdate = true;
    
    // Xoay trái tim
    heartParticles.rotation.y += ROTATION_SPEED;
    heartParticles.rotation.x = Math.sin(time * 0.5) * 0.15;
    
    // Nhấp nháy nhẹ
    heartParticles.material.opacity = 0.9 + Math.sin(time * 2) * 0.05;
    
    renderer.render(scene, camera);
}

// ========== RESPONSIVE ==========
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ========== KHỞI ĐỘNG ==========
initThreeJS();
animate();
</script>

</body>
</html>
