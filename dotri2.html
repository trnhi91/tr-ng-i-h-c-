<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(180deg, #0a1628 0%, #1a3a52 50%, #2d5a7b 100%);
        }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="koiCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('koiCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, mouse = { x: 0, y: 0 };
        const points = 40;
        const segLength = 8;
        let segments = [];
        let ripples = [];
        let time = 0;

        function init() {
            resize();
            mouse.x = width / 2;
            mouse.y = height / 2;
            segments = Array.from({ length: points }, () => ({ x: mouse.x, y: mouse.y, angle: 0 }));
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('click', e => {
            ripples.push({
                x: e.clientX,
                y: e.clientY,
                radius: 0,
                maxRadius: 100,
                opacity: 1
            });
        });

        function update() {
            segments[0].x += (mouse.x - segments[0].x) * 0.15;
            segments[0].y += (mouse.y - segments[0].y) * 0.15;
            for (let i = 1; i < points; i++) {
                const dx = segments[i - 1].x - segments[i].x;
                const dy = segments[i - 1].y - segments[i].y;
                segments[i].angle = Math.atan2(dy, dx);
                segments[i].x = segments[i - 1].x - Math.cos(segments[i].angle) * segLength;
                segments[i].y = segments[i - 1].y - Math.sin(segments[i].angle) * segLength;
            }
        }

        function drawKoiSegment(x, y, size, angle, index) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            const progress = 1 - index / points;
            
            // Gradient chính với màu cam đỏ vàng lộng lẫy
            const grad = ctx.createRadialGradient(-size/3, -size/2, 0, 0, 0, size * 1.3);
            
            if (index < points * 0.15) {
                // Đầu - cam đỏ
                grad.addColorStop(0, '#FFD700');
                grad.addColorStop(0.2, '#FF8C00');
                grad.addColorStop(0.5, '#FF6347');
                grad.addColorStop(0.8, '#DC143C');
                grad.addColorStop(1, '#B22222');
            } else if (index < points * 0.5) {
                // Thân trước - trắng với vệt cam
                grad.addColorStop(0, '#FFFFFF');
                grad.addColorStop(0.3, '#FFE4B5');
                grad.addColorStop(0.6, '#FFA500');
                grad.addColorStop(1, '#FF8C00');
            } else if (index < points * 0.7) {
                // Thân giữa - đỏ cam
                grad.addColorStop(0, '#FF6347');
                grad.addColorStop(0.4, '#FF4500');
                grad.addColorStop(0.7, '#DC143C');
                grad.addColorStop(1, '#8B0000');
            } else {
                // Đuôi - trắng với viền cam đỏ
                grad.addColorStop(0, '#FFFFFF');
                grad.addColorStop(0.5, '#FFE4E1');
                grad.addColorStop(0.8, '#FFA07A');
                grad.addColorStop(1, '#FF6347');
            }

            // Viền vàng kim
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Vảy cá lấp lánh
            if (index % 3 === 0) {
                for (let i = 0; i < 3; i++) {
                    ctx.save();
                    ctx.rotate((i * Math.PI * 2 / 3) + time);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(size * 0.4, 0, size * 0.2, size * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
            
            ctx.restore();
        }

        function draw() {
            time += 0.03;
            
            // Nền hồ nước với ánh trăng
            const bgGrad = ctx.createRadialGradient(width/2, height/3, 0, width/2, height/2, height);
            bgGrad.addColorStop(0, '#1a4d6d');
            bgGrad.addColorStop(0.5, '#0f2e45');
            bgGrad.addColorStop(1, '#0a1628');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);
            
            // Ánh trăng phản chiếu
            ctx.save();
            ctx.globalAlpha = 0.1;
            const moonGrad = ctx.createRadialGradient(width/2, height/4, 0, width/2, height/4, 200);
            moonGrad.addColorStop(0, '#ffffff');
            moonGrad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = moonGrad;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
            
            // Tia sáng dưới nước
            for(let i = 0; i < 6; i++) {
                ctx.save();
                ctx.globalAlpha = 0.04 + Math.sin(time + i * 0.5) * 0.02;
                const x = (width / 7) * (i + 1) + Math.sin(time * 0.3 + i) * 80;
                const lightGrad = ctx.createLinearGradient(x, 0, x, height);
                lightGrad.addColorStop(0, 'rgba(173, 216, 230, 0.3)');
                lightGrad.addColorStop(1, 'rgba(173, 216, 230, 0)');
                ctx.fillStyle = lightGrad;
                ctx.fillRect(x - 30, 0, 60, height);
                ctx.restore();
            }
            
            update();
            
            // Vẽ gợn sóng
            ripples = ripples.filter(r => r.opacity > 0);
            ripples.forEach(r => {
                r.radius += 2;
                r.opacity -= 0.01;
                
                ctx.save();
                ctx.globalAlpha = r.opacity;
                ctx.strokeStyle = `rgba(173, 216, 230, ${r.opacity})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.strokeStyle = `rgba(255, 255, 255, ${r.opacity * 0.5})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius + 5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            });

            // Bóng đổ với chuyển động
            ctx.save();
            ctx.globalAlpha = 0.2;
            ctx.beginPath();
            const shadowY = segments[8].y + 60 + Math.sin(time) * 8;
            ctx.ellipse(segments[8].x, shadowY, 70 + Math.sin(time * 1.2) * 15, 30, segments[8].angle, 0, Math.PI*2);
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.fill();
            ctx.restore();

            // Vẽ thân cá Koi
            for (let i = points - 1; i >= 0; i--) {
                const s = segments[i];
                const baseSize = Math.sin((1 - i / points) * Math.PI * 0.8) * 35 + 5;
                const wave = Math.sin(time * 3 + i * 0.3) * 2;
                const size = baseSize + wave;
                drawKoiSegment(s.x, s.y, size, s.angle, i);

                // Vây lưng
                if (i === 10) {
                    ctx.save();
                    ctx.translate(s.x, s.y);
                    ctx.rotate(s.angle);
                    const finGrad = ctx.createLinearGradient(0, 0, -15, -50);
                    finGrad.addColorStop(0, '#FF6347');
                    finGrad.addColorStop(0.3, '#FF4500');
                    finGrad.addColorStop(0.6, '#FFD700');
                    finGrad.addColorStop(1, 'rgba(255, 215, 0, 0.3)');
                    ctx.fillStyle = finGrad;
                    ctx.beginPath();
                    ctx.moveTo(0, 5);
                    ctx.bezierCurveTo(-8, -15, -12, -45, -18, -8);
                    ctx.bezierCurveTo(-12, -42, -6, -12, 0, 5);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.restore();
                }
                
                // Vây ngực
                if (i === 6) {
                    ctx.save();
                    ctx.translate(s.x, s.y);
                    ctx.rotate(s.angle);
                    
                    const pectGrad = ctx.createRadialGradient(20, -15, 0, 20, -15, 25);
                    pectGrad.addColorStop(0, '#FFE4B5');
                    pectGrad.addColorStop(0.5, '#FFA500');
                    pectGrad.addColorStop(1, 'rgba(255, 165, 0, 0.2)');
                    
                    // Vây trái
                    ctx.fillStyle = pectGrad;
                    ctx.beginPath();
                    ctx.moveTo(0, -8);
                    ctx.bezierCurveTo(10, -20, 30, -18, 28, -5);
                    ctx.bezierCurveTo(25, 0, 8, -2, 0, -8);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    // Vây phải
                    ctx.beginPath();
                    ctx.moveTo(0, 8);
                    ctx.bezierCurveTo(10, 20, 30, 18, 28, 5);
                    ctx.bezierCurveTo(25, 0, 8, 2, 0, 8);
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }

            // Đầu cá Koi chi tiết
            ctx.save();
            const head = segments[1];
            ctx.translate(head.x, head.y);
            ctx.rotate(head.angle);
            
            // Mắt với ánh sáng
            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.arc(18, -10, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(18, 10, 4, 0, Math.PI*2);
            ctx.fill();
            
            // Ánh mắt
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            ctx.beginPath();
            ctx.arc(19, -11, 1.5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(19, 9, 1.5, 0, Math.PI*2);
            ctx.fill();
            
            // Miệng
            ctx.strokeStyle = "rgba(139, 0, 0, 0.5)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(25, 0, 5, 0.2, -0.2);
            ctx.stroke();
            
            // Râu cá Koi (whiskers)
            ctx.strokeStyle = "rgba(255, 215, 0, 0.6)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(22, -3);
            ctx.bezierCurveTo(30, -8, 38, -10, 45, -8);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(22, 3);
            ctx.bezierCurveTo(30, 8, 38, 10, 45, 8);
            ctx.stroke();
            
            ctx.restore();

            // Đuôi cá Koi lộng lẫy
            const t = segments[points-1];
            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.rotate(t.angle + Math.sin(time * 2.5) * 0.15);
            
            // Bóng đuôi
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.moveTo(3, 3);
            ctx.bezierCurveTo(20, -45, -45, -48, -20, 3);
            ctx.bezierCurveTo(-45, 48, 20, 45, 3, 3);
            ctx.fill();
            
            // Đuôi chính với nhiều màu
            const tailGrad = ctx.createLinearGradient(-30, 0, 10, 0);
            tailGrad.addColorStop(0, '#FFE4E1');
            tailGrad.addColorStop(0.2, '#FFFFFF');
            tailGrad.addColorStop(0.4, '#FFD700');
            tailGrad.addColorStop(0.6, '#FFA500');
            tailGrad.addColorStop(0.8, '#FF6347');
            tailGrad.addColorStop(1, '#FF4500');
            ctx.fillStyle = tailGrad;
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(18, -42, -42, -45, -18, 0);
            ctx.bezierCurveTo(-42, 45, 18, 42, 0, 0);
            ctx.fill();
            
            // Viền vàng kim cho đuôi
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Chi tiết gân đuôi
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            for(let i = -30; i < 0; i += 10) {
                ctx.beginPath();
                ctx.moveTo(i, -35);
                ctx.quadraticCurveTo(i - 3, 0, i, 35);
                ctx.stroke();
            }
            
            ctx.restore();

            requestAnimationFrame(draw);
        }

        init();
        draw();
    </script>
</body>
</html>
