<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cute Cat - Hand Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; text-align: center; background: rgba(0, 0, 0, 0.9); padding: 40px 60px; border-radius: 25px; border: 3px solid #ffa500; box-shadow: 0 0 50px rgba(255, 165, 0, 0.8); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } }
        #loading h2 { color: #ffa500; font-size: 28px; margin-bottom: 15px; text-shadow: 0 0 20px #ffa500; }
        #loading p { color: #fff; font-size: 14px; }
        .ui-panel { position: fixed; top: 20px; left: 20px; color: white; z-index: 100; pointer-events: none; }
        .ui-panel h1 { font-size: 36px; margin: 0 0 15px 0; background: linear-gradient(90deg, #ffa500, #ff6347, #ffd700); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradient-shift 3s linear infinite; filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.8)); }
        @keyframes gradient-shift { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .status { font-size: 16px; padding: 12px 20px; background: rgba(0, 0, 0, 0.7); border-radius: 15px; border-left: 4px solid #ffa500; box-shadow: 0 0 20px rgba(255, 165, 0, 0.3); backdrop-filter: blur(10px); }
        .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); padding: 20px 30px; border-radius: 20px; color: white; text-align: center; pointer-events: none; }
        .controls div { margin: 5px 0; font-size: 14px; }
        #video-input { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="loading"><h2>🐱 ĐANG TẢI MÈO CỦA DIỄM QUỲNH</h2><p>Chuẩn bị camera nhé!</p></div>
<div class="ui-panel"><h1>🐱 </h1><div class="status"><span id="status-text">Đang khởi động...</span></div></div>
<div class="controls">
    <div>👆 <strong>Giơ ngón trỏ lên:</strong> Mèo nhảy</div>
    <div>👈 <strong>Tay qua trái:</strong> Xoay trái</div>
    <div>👉 <strong>Tay qua phải:</strong> Xoay phải</div>
</div>
<div id="canvas-container"></div>
<video id="video-input" playsinline autoplay></video>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const videoEl = document.getElementById('video-input');
const loadingEl = document.getElementById('loading');
const statusEl = document.getElementById('status-text');
const container = document.getElementById('canvas-container');

let scene, camera, renderer, catGroup;
let targetRotationY = 0;
let currentRotationY = 0;
let targetJump = 0;
let currentJump = 0;

function createCat() {
    const group = new THREE.Group();
    
    // Màu sắc
    const orangeMat = new THREE.MeshPhongMaterial({ 
        color: 0xffa500, 
        shininess: 80,
        specular: 0x444444
    });
    const whiteMat = new THREE.MeshPhongMaterial({ 
        color: 0xfff8dc, 
        shininess: 100 
    });
    const pinkMat = new THREE.MeshPhongMaterial({ 
        color: 0xff69b4, 
        shininess: 60 
    });
    const blackMat = new THREE.MeshPhongMaterial({ 
        color: 0x000000, 
        shininess: 80 
    });
    
    // Thân (oval lớn)
    const bodyGeo = new THREE.SphereGeometry(0.5, 32, 32);
    bodyGeo.scale(1, 1.2, 0.9);
    const body = new THREE.Mesh(bodyGeo, orangeMat);
    body.position.set(0, 0, 0);
    body.castShadow = true;
    group.add(body);
    
    // Bụng trắng
    const bellyGeo = new THREE.SphereGeometry(0.35, 32, 32);
    bellyGeo.scale(0.9, 1, 0.8);
    const belly = new THREE.Mesh(bellyGeo, whiteMat);
    belly.position.set(0, -0.1, 0.45);
    group.add(belly);
    
    // Đầu (hình cầu to)
    const headGeo = new THREE.SphereGeometry(0.4, 32, 32);
    const head = new THREE.Mesh(headGeo, orangeMat);
    head.position.set(0, 0.7, 0);
    head.castShadow = true;
    group.add(head);
    
    // Mặt trắng
    const faceGeo = new THREE.SphereGeometry(0.3, 32, 32);
    faceGeo.scale(0.9, 0.85, 0.5);
    const face = new THREE.Mesh(faceGeo, whiteMat);
    face.position.set(0, 0.65, 0.35);
    group.add(face);
    
    // Tai trái
    const earGeo = new THREE.ConeGeometry(0.15, 0.3, 32);
    const earLeft = new THREE.Mesh(earGeo, orangeMat);
    earLeft.position.set(-0.25, 1, 0);
    earLeft.rotation.z = -0.3;
    earLeft.castShadow = true;
    group.add(earLeft);
    
    // Bên trong tai trái
    const innerEarGeo = new THREE.ConeGeometry(0.08, 0.15, 32);
    const innerEarLeft = new THREE.Mesh(innerEarGeo, pinkMat);
    innerEarLeft.position.set(-0.25, 0.95, 0.05);
    innerEarLeft.rotation.z = -0.3;
    group.add(innerEarLeft);
    
    // Tai phải
    const earRight = new THREE.Mesh(earGeo, orangeMat);
    earRight.position.set(0.25, 1, 0);
    earRight.rotation.z = 0.3;
    earRight.castShadow = true;
    group.add(earRight);
    
    // Bên trong tai phải
    const innerEarRight = new THREE.Mesh(innerEarGeo, pinkMat);
    innerEarRight.position.set(0.25, 0.95, 0.05);
    innerEarRight.rotation.z = 0.3;
    group.add(innerEarRight);
    
    // Mắt trái
    const eyeGeo = new THREE.SphereGeometry(0.08, 32, 32);
    const eyeLeft = new THREE.Mesh(eyeGeo, blackMat);
    eyeLeft.position.set(-0.12, 0.75, 0.35);
    eyeLeft.scale.set(1, 1.3, 0.8);
    group.add(eyeLeft);
    
    // Mắt phải
    const eyeRight = new THREE.Mesh(eyeGeo, blackMat);
    eyeRight.position.set(0.12, 0.75, 0.35);
    eyeRight.scale.set(1, 1.3, 0.8);
    group.add(eyeRight);
    
    // Mũi
    const noseGeo = new THREE.SphereGeometry(0.05, 32, 32);
    noseGeo.scale(0.8, 0.6, 0.6);
    const nose = new THREE.Mesh(noseGeo, pinkMat);
    nose.position.set(0, 0.62, 0.42);
    group.add(nose);
    
    // Miệng (2 đường cong)
    const mouthCurve1 = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(0, 0.6, 0.42),
        new THREE.Vector3(-0.05, 0.57, 0.42),
        new THREE.Vector3(-0.1, 0.58, 0.4)
    );
    const mouthCurve2 = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(0, 0.6, 0.42),
        new THREE.Vector3(0.05, 0.57, 0.42),
        new THREE.Vector3(0.1, 0.58, 0.4)
    );
    const mouthGeo1 = new THREE.TubeGeometry(mouthCurve1, 20, 0.01, 8, false);
    const mouthGeo2 = new THREE.TubeGeometry(mouthCurve2, 20, 0.01, 8, false);
    const mouth1 = new THREE.Mesh(mouthGeo1, blackMat);
    const mouth2 = new THREE.Mesh(mouthGeo2, blackMat);
    group.add(mouth1);
    group.add(mouth2);
    
    // Râu trái
    for (let i = 0; i < 3; i++) {
        const whiskerGeo = new THREE.CylinderGeometry(0.005, 0.005, 0.4, 8);
        const whisker = new THREE.Mesh(whiskerGeo, blackMat);
        whisker.position.set(-0.15, 0.68 - i * 0.05, 0.38);
        whisker.rotation.z = Math.PI / 2 + (i - 1) * 0.15;
        group.add(whisker);
    }
    
    // Râu phải
    for (let i = 0; i < 3; i++) {
        const whiskerGeo = new THREE.CylinderGeometry(0.005, 0.005, 0.4, 8);
        const whisker = new THREE.Mesh(whiskerGeo, blackMat);
        whisker.position.set(0.15, 0.68 - i * 0.05, 0.38);
        whisker.rotation.z = -Math.PI / 2 - (i - 1) * 0.15;
        group.add(whisker);
    }
    
    // Chân trước trái
    const legGeo = new THREE.CylinderGeometry(0.08, 0.09, 0.4, 32);
    const legFL = new THREE.Mesh(legGeo, orangeMat);
    legFL.position.set(-0.25, -0.4, 0.2);
    legFL.castShadow = true;
    group.add(legFL);
    
    // Bàn chân trước trái
    const pawGeo = new THREE.SphereGeometry(0.1, 32, 32);
    pawGeo.scale(1, 0.6, 1);
    const pawFL = new THREE.Mesh(pawGeo, whiteMat);
    pawFL.position.set(-0.25, -0.62, 0.2);
    group.add(pawFL);
    
    // Chân trước phải
    const legFR = new THREE.Mesh(legGeo, orangeMat);
    legFR.position.set(0.25, -0.4, 0.2);
    legFR.castShadow = true;
    group.add(legFR);
    
    const pawFR = new THREE.Mesh(pawGeo, whiteMat);
    pawFR.position.set(0.25, -0.62, 0.2);
    group.add(pawFR);
    
    // Chân sau trái
    const legBL = new THREE.Mesh(legGeo, orangeMat);
    legBL.position.set(-0.25, -0.4, -0.15);
    legBL.castShadow = true;
    group.add(legBL);
    
    const pawBL = new THREE.Mesh(pawGeo, whiteMat);
    pawBL.position.set(-0.25, -0.62, -0.15);
    group.add(pawBL);
    
    // Chân sau phải
    const legBR = new THREE.Mesh(legGeo, orangeMat);
    legBR.position.set(0.25, -0.4, -0.15);
    legBR.castShadow = true;
    group.add(legBR);
    
    const pawBR = new THREE.Mesh(pawGeo, whiteMat);
    pawBR.position.set(0.25, -0.62, -0.15);
    group.add(pawBR);
    
    // Đuôi (đường cong đẹp)
    const tailCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, -0.4),
        new THREE.Vector3(-0.1, 0.1, -0.6),
        new THREE.Vector3(-0.05, 0.3, -0.8),
        new THREE.Vector3(0, 0.5, -0.9)
    ]);
    const tailGeo = new THREE.TubeGeometry(tailCurve, 40, 0.06, 16, false);
    const tail = new THREE.Mesh(tailGeo, orangeMat);
    tail.castShadow = true;
    group.add(tail);
    
    // Đuôi trắng
    const tailTipGeo = new THREE.SphereGeometry(0.08, 32, 32);
    const tailTip = new THREE.Mesh(tailTipGeo, whiteMat);
    tailTip.position.set(0, 0.5, -0.9);
    group.add(tailTip);
    
    return group;
}

function initThreeJS() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 5, 15);
    
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 4);
    camera.lookAt(0, 0, 0);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);
    
    // Ánh sáng
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 10, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);
    
    const pointLight = new THREE.PointLight(0xffd700, 0.5, 100);
    pointLight.position.set(-3, 3, 3);
    scene.add(pointLight);
    
    // Tạo mèo
    catGroup = createCat();
    scene.add(catGroup);
    
    // Mặt đất
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshPhongMaterial({ 
        color: 0x90ee90,
        shininess: 10
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.7;
    ground.receiveShadow = true;
    scene.add(ground);
}

const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.3,  // Giảm từ 0.5 xuống 0.3 - phát hiện nhạy hơn
    minTrackingConfidence: 0.3    // Giảm từ 0.5 xuống 0.3 - theo dõi nhạy hơn
});

hands.onResults(onHandResults);

function onHandResults(results) {
    loadingEl.style.display = 'none';
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        const wrist = hand[0];
        const indexTip = hand[8];
        const indexMcp = hand[5];
        
        // Vị trí tay (trái/phải) - TĂNG ĐỘ NHẠY
        const handX = wrist.x;
        
        // Ngưỡng nhạy hơn: 0.45 và 0.55 thay vì 0.35 và 0.65
        if (handX < 0.45) {
            targetRotationY = -Math.PI / 2; // Xoay trái
            statusEl.innerText = '👈 Xoay trái';
            statusEl.style.color = '#00ff88';
        } else if (handX > 0.55) {
            targetRotationY = Math.PI / 2; // Xoay phải
            statusEl.innerText = '👉 Xoay phải';
            statusEl.style.color = '#00ff88';
        } else {
            targetRotationY = 0; // Về giữa
            statusEl.innerText = '✋ Giữa';
            statusEl.style.color = '#ffd700';
        }
        
        // Điều khiển nhảy: giơ ngón trỏ lên cao - TĂNG ĐỘ NHẠY
        // Giảm ngưỡng từ 0.1 xuống 0.05
        const fingerUp = indexTip.y < indexMcp.y - 0.05;
        if (fingerUp) {
            targetJump = 0.8;
            statusEl.innerText = '👆 Mèo nhảy!';
            statusEl.style.color = '#ff69b4';
        } else if (targetJump > 0) {
            targetJump = 0;
        }
        
    } else {
        statusEl.innerText = '👋 Đưa tay lên camera...';
        statusEl.style.color = '#ffa500';
        targetRotationY = 0;
        targetJump = 0;
    }
}

const cameraUtil = new Camera(videoEl, {
    onFrame: async () => {
        await hands.send({ image: videoEl });
    },
    width: 640,
    height: 480
});
cameraUtil.start();

function animate() {
    requestAnimationFrame(animate);
    
    const time = Date.now() * 0.001;
    
    // Smooth rotation - TĂNG TỐC ĐỘ PHẢN HỒI từ 0.1 lên 0.2
    currentRotationY += (targetRotationY - currentRotationY) * 0.2;
    catGroup.rotation.y = currentRotationY;
    
    // Smooth jump - TĂNG TỐC ĐỘ PHẢN HỒI từ 0.15 lên 0.25
    currentJump += (targetJump - currentJump) * 0.25;
    catGroup.position.y = currentJump;
    
    // Breathing animation
    const breathe = Math.sin(time * 2) * 0.02;
    catGroup.scale.set(1 + breathe, 1 - breathe * 0.5, 1 + breathe);
    
    // Tail wag
    if (catGroup.children.length > 0) {
        const tail = catGroup.children[catGroup.children.length - 2];
        if (tail) {
            tail.rotation.x = Math.sin(time * 3) * 0.3;
            tail.rotation.z = Math.cos(time * 2) * 0.2;
        }
    }
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

initThreeJS();
animate();
</script>
</body>
</html>
