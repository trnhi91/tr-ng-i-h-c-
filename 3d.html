<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Hollow Heart - Deeper Glow</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        body::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255, 0, 85, 0.08) 0%, transparent 75%);
            pointer-events: none;
        }

        #ui { position: fixed; top: 30px; left: 30px; color: white; z-index: 10; pointer-events: none; }
        #ui h1 { font-weight: 200; letter-spacing: 10px; font-size: 18px; color: #ff0055; text-shadow: 0 0 15px #ff0055; }

        #card { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: rgba(10, 2, 5, 0.92); border: 1px solid rgba(255, 0, 85, 0.4); padding: 40px;
            text-align: center; color: white; border-radius: 20px; opacity: 0; 
            transition: 1.2s all cubic-bezier(0.19, 1, 0.22, 1); pointer-events: none;
            backdrop-filter: blur(15px); box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        #card.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: all; }
        
        .btn { 
            border: 1px solid #ff0055; background: none; color: #ff0055; padding: 12px 35px; 
            cursor: pointer; margin-top: 25px; border-radius: 50px; font-size: 11px;
            transition: 0.3s; letter-spacing: 2px; text-transform: uppercase;
        }
        .btn:hover { background: #ff0055; color: white; box-shadow: 0 0 25px #ff0055; }
    </style>
</head>
<body>

<div id="ui">
    <h1>DEEP AURA</h1>
    <div style="font-size: 9px; opacity: 0.4; letter-spacing: 3px; margin-top: 5px;">STABILIZED VIEW</div>
</div>

<div id="card">
    <h2 style="margin-bottom: 15px; font-weight: 300; letter-spacing: 2px;">HAPPY BIRTHDAY ❤️</h2>
    <p style="font-size: 14px; opacity: 0.8; line-height: 1.6;">Gửi Trần Nhi một chút lấp lánh cho ngày đặc biệt.</p>
    <button class="btn" onclick="this.parentElement.classList.remove('show')">CLOSE</button>
</div>

<video id="v" style="display:none" playsinline autoplay></video>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
let scene, camera, renderer, particles, geometry;
let targetScale = 1, currentScale = 1;

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 22;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const count = 120000; // Tăng thêm hạt để lấp đầy phần rải sâu
    geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    for(let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;
        
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        
        // CHỈNH SỬA TẠI ĐÂY: thickness chạy từ 0.65 đến 1.05 để hạt rải sâu vào trong
        const thickness = 0.65 + Math.random() * 0.4; 
        
        // Giữ độ phẳng (Z thấp) để không bị dày cục
        const z = (Math.random() - 0.5) * 1.2; 

        positions[i*3] = x * thickness * 0.45;
        positions[i*3+1] = y * thickness * 0.45;
        positions[i*3+2] = z;

        const color = new THREE.Color();
        const l = 0.3 + Math.random() * 0.5; // Độ sáng ngẫu nhiên tạo hiệu ứng lấp lánh
        color.setHSL(0.94, 0.85, l);
        
        colors[i*3] = color.r;
        colors[i*3+1] = color.g;
        colors[i*3+2] = color.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.045,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.55
    });

    particles = new THREE.Points(geometry, material);
    scene.add(particles);
}

const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });
hands.onResults(results => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const h = results.multiHandLandmarks[0];
        const dist = Math.hypot(h[4].x - h[8].x, h[4].y - h[8].y);
        targetScale = 0.8 + dist * 3.5;
        if(dist > 0.45) document.getElementById('card').classList.add('show');
    } else {
        targetScale = 1;
    }
});

const cam = new Camera(document.getElementById('v'), {
    onFrame: async () => { await hands.send({ image: document.getElementById('v') }); },
    width: 640, height: 480
});
cam.start();

function animate() {
    requestAnimationFrame(animate);
    const time = Date.now() * 0.001;

    currentScale = THREE.MathUtils.lerp(currentScale, targetScale, 0.05);
    const pulse = currentScale + Math.sin(time * 2.5) * 0.03;
    particles.scale.set(pulse, pulse, pulse);

    // Xoay cinematic chậm rãi
    particles.rotation.y += 0.001; 
    particles.rotation.z = Math.sin(time * 0.4) * 0.02;

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
animate();
</script>
</body>
</html>
